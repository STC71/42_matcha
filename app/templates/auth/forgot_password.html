{% extends "base.html" %}
{% block title %}Forgot password — Matcha{% endblock %}
{% block content %}
<div class="min-h-[60vh] flex items-center justify-center">
  <div class="max-w-md w-full text-center space-y-6">
    <h2 class="text-2xl font-bold">Forgot your password?</h2>
    <form method="POST" class="space-y-4">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input name="email" type="email" required placeholder="Your email"
             class="block w-full rounded-md border border-gray-300 px-3 py-2">
      <button type="submit" class="w-full py-2.5 rounded-md text-white bg-matcha-600 hover:bg-matcha-700">
        Send reset link
      </button>
    </form>
    <a href="{{ url_for('auth.login') }}" class="text-sm text-matcha-600 hover:underline">← Back to login</a>
  </div>
</div>
{% endblock %}
