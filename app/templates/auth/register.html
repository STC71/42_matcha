{% extends "base.html" %}
{% block title %}Sign up — Matcha{% endblock %}
{% block content %}
<div class="min-h-[70vh] flex items-center justify-center py-12 px-4">
  <div class="max-w-md w-full space-y-8">
    <div class="text-center">
      <h2 class="text-3xl font-bold text-gray-900">Create your account</h2>
    </div>
    <form class="mt-8 space-y-4" method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700">First name</label>
          <input name="first_name" required class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">Last name</label>
          <input name="last_name" required class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2">
        </div>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700">Username</label>
        <input name="username" required class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700">Email</label>
        <input name="email" type="email" required class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700">Password</label>
        <input name="password" type="password" required minlength="8"
               class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2">
        <p class="mt-1 text-xs text-gray-500">Min. 8 characters. Avoid common dictionary words.</p>
      </div>
      <button type="submit"
              class="w-full py-2.5 px-4 rounded-md text-sm font-medium text-white bg-matcha-600 hover:bg-matcha-700">
        Create account
      </button>
    </form>
    <p class="text-center text-sm text-gray-600">
      Already have an account? <a href="{{ url_for('auth.login') }}" class="font-medium text-matcha-600 hover:underline">Log in</a>
    </p>
  </div>
</div>
{% endblock %}
